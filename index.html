<style>
:root{--ink:#192b3a;--muted:#5f6f7a;--accent:#087e83;--line:#dce5e8;--paper:#fff;--rail:#f1f6f6}
*{box-sizing:border-box}body{margin:0;background:#e9eff0;color:var(--ink);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}.resume{width:min(210mm,100%);min-height:297mm;margin:28px auto;background:var(--paper);display:grid;grid-template-columns:minmax(175px,32%) minmax(0,1fr);align-items:stretch;box-shadow:0 12px 40px #1b34401c}.rail{grid-column:1;grid-row:1;background:var(--rail);padding:15mm 9mm}.rail section+section{margin-top:25px}.main{grid-column:2;grid-row:1;padding:15mm 13mm 14mm 12mm}.eyebrow{color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.rail h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 8px;color:var(--accent)}.rail p,.rail li{font-size:12px;line-height:1.55;margin:0 0 6px}.rail ul{padding-left:16px;margin:0}.contact a{overflow-wrap:anywhere;color:inherit;text-decoration:none}.name{font-size:34px;line-height:1.05;letter-spacing:-.04em;margin:8px 0 7px}.headline{font-size:15px;color:var(--accent);font-weight:650;margin:0}.location{margin-top:6px;color:var(--muted);font-size:12px}.intro{font-size:13px;color:#344957;margin:20px 0 25px;max-width:640px}.section-title{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}.job{margin:0 0 18px;break-inside:avoid}.job-head{display:flex;justify-content:space-between;gap:16px;align-items:baseline}.company{font-size:15px;font-weight:750}.dates{font-size:11px;color:var(--muted);white-space:nowrap}.role{font-size:12px;color:var(--accent);font-weight:650;margin:1px 0 6px}.job p{font-size:12px;line-height:1.5;color:#344957;margin:0 0 5px;text-wrap:pretty}.note{font-size:11px;color:var(--muted)}
@media(max-width:560px){.resume{width:100%;margin:0;display:flex;flex-direction:column}.main{order:1;padding:28px}.rail{order:2;display:block;padding:24px}.rail section+section{margin-top:22px}.name{font-size:30px}}
@media(min-width:561px) and (max-width:820px){.rail{padding:28px 20px}.main{padding:32px 26px}}
@page{size:A4;margin:0}
@media print{body{background:#fff;font-size:12px}.resume{width:min(210mm,100%);min-height:297mm;margin:0;box-shadow:none;break-after:auto}.rail{padding:14mm 9mm}.main{padding:14mm 13mm 13mm 12mm}.job{break-inside:avoid}.contact a{color:inherit;text-decoration:none}}
</style>
</head>

    {"company":"Supercell","dates":"Sep 2024 – Dec 2024","role":"Technical Artist · Spark Program","paragraphs":["Collaborated on three game prototypes during Supercell’s Spark Program, developing each concept over a three-to-four-week cycle. Worked on UX and UI design, taking prototypes from initial design through full in-game implementation."]},

<div id="resume"></div>
<script>
(() => {
  const data = JSON.parse(document.getElementById('resume-data').textContent);
  const root = document.getElementById('resume');
  const el = (tag, cls, text) => { const node=document.createElement(tag); if(cls) node.className=cls; if(text!==undefined) node.textContent=text; return node; };
  const main=el('main','main');
  main.append(el('div','eyebrow','Resume'),el('h1','name',data.name),el('p','headline',data.headline),el('p','location',data.location),el('p','intro',data.summary),el('h2','section-title','Experience'));
  data.experience.forEach(job=>{
    const article=el('article','job'),head=el('div','job-head');
    head.append(el('div','company',job.company),el('div','dates',job.dates));
    article.append(head,el('div','role',job.role));
    job.paragraphs.forEach(text=>article.append(el('p','',text)));
    main.append(article);
  });
  const rail=el('aside','rail');
  const group=(title,content)=>{const section=el('section');section.append(el('h2','',title),content);rail.append(section);};
  const contact=el('div','contact');contact.append(el('p','',data.location));
  data.contact.forEach(item=>{const p=el('p'),a=el('a','',item.text);a.href=item.href;a.setAttribute('aria-label',item.label+': '+item.text);p.append(a);contact.append(p);});
  group('Contact',contact);
  group('Core Skills',el('p','',data.coreSkills.join(' · ')));
  group('Tools & Technologies',el('p','',data.tools.join(' · ')));
  const page=el('section','resume');page.append(main,rail);root.append(page);
})();
</script>
