<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antto Väätäinen | UI Technical Artist</title>
<meta name="description" content="Resume of Antto Väätäinen, UI Technical Artist and Technical Artist based in Helsinki, Finland.">
<style>
:root{--ink:#192b3a;--muted:#5f6f7a;--accent:#087e83;--line:#dce5e8;--paper:#fff;--rail:#f1f6f6}
*{box-sizing:border-box}body{margin:0;background:#e9eff0;color:var(--ink);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}.resume{width:min(210mm,100%);min-height:297mm;margin:28px auto;background:var(--paper);display:grid;grid-template-columns:minmax(175px,32%) minmax(0,1fr);align-items:stretch;box-shadow:0 12px 40px #1b34401c}.rail{grid-column:1;grid-row:1;background:var(--rail);padding:15mm 9mm}.rail section+section{margin-top:25px}.main{grid-column:2;grid-row:1;padding:15mm 13mm 14mm 12mm}.eyebrow{color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.rail h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 8px;color:var(--accent)}.rail p,.rail li{font-size:12px;line-height:1.55;margin:0 0 6px}.rail ul{padding-left:16px;margin:0}.contact a{overflow-wrap:anywhere;color:#1769aa;text-decoration:underline;text-underline-offset:2px}.contact a:hover,.contact a:focus-visible{color:#0b4f8a;text-decoration-thickness:2px}.name{font-size:34px;line-height:1.05;letter-spacing:-.04em;margin:8px 0 7px}.headline{font-size:15px;color:var(--accent);font-weight:650;margin:0}.location{margin-top:6px;color:var(--muted);font-size:12px}.intro{font-size:13px;color:#344957;margin:20px 0 25px;max-width:640px}.section-title{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}.job{margin:0 0 18px;break-inside:avoid}.job-head{display:flex;justify-content:space-between;gap:16px;align-items:baseline}.company{font-size:15px;font-weight:750}.company-link{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;margin-left:5px;color:var(--accent);line-height:0;vertical-align:baseline;text-decoration:none}.company-link svg{display:block;width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.company-link:hover,.company-link:focus-visible{color:#0b4f8a;text-decoration:underline}.dates{font-size:11px;color:var(--muted);white-space:nowrap}.role{font-size:12px;color:var(--accent);font-weight:650;margin:1px 0 6px}.job p{font-size:12px;line-height:1.5;color:#344957;margin:0 0 5px;text-wrap:pretty}.note{font-size:11px;color:var(--muted)}.web-only{margin-top:28px}.project{margin:0 0 15px;break-inside:avoid}.project-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.project-name{margin:0;font-size:14px;font-weight:750}.project-description,.project-highlights{font-size:12px;line-height:1.5;color:#344957;margin:4px 0 0}.project-highlights{padding-left:18px}.project-highlights li{margin:0 0 3px}
@media(max-width:560px){.resume{width:100%;margin:0;display:flex;flex-direction:column}.main{order:1;padding:28px}.rail{order:2;display:block;padding:24px}.rail section+section{margin-top:22px}.name{font-size:30px}}
@media(min-width:561px) and (max-width:820px){.rail{padding:28px 20px}.main{padding:32px 26px}}
@page{size:A4;margin:0}
@media print{body{background:#fff;font-size:12px}.resume{width:min(210mm,100%);min-height:297mm;margin:0;box-shadow:none;break-after:auto}.rail{padding:14mm 9mm}.main{padding:14mm 13mm 13mm 12mm}.job{break-inside:avoid}}
.page-tools{width:min(210mm,100%);margin:24px auto 12px;padding:0 12px;display:flex;justify-content:flex-end;gap:10px;position:relative;z-index:2}.tool-button{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 14px;border:1px solid #c8d6db;border-radius:8px;background:#fff;color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;line-height:1.2;text-decoration:none;cursor:pointer}.tool-button:hover,.tool-button:focus-visible{border-color:var(--accent);color:var(--accent);outline:2px solid #087e8333;outline-offset:2px}.share-tool{position:relative}.share-tool summary{list-style:none}.share-tool summary::-webkit-details-marker{display:none}.qr-panel{position:absolute;top:calc(100% + 8px);right:0;width:256px;padding:16px;display:grid;gap:10px;justify-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 10px 28px #1b344026}.qr-panel img{display:block;width:160px;height:160px;background:#fff}.qr-panel p{margin:0;color:var(--muted);font-size:12px;text-align:center}.qr-download{color:#1769aa;font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:2px}@media(max-width:560px){.page-tools{width:100%;margin:16px auto 8px;padding:0 18px}.qr-panel{max-width:min(256px,calc(100vw - 36px))}}@media print{.page-tools,.company-link,.web-only{display:none!important}}</style>
<style>
.project{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;margin:0 0 18px;break-inside:avoid}.project-thumbnail-link{display:block;align-self:start}.project-thumbnail{display:block;width:120px;aspect-ratio:16/10;object-fit:cover;border-radius:6px;background:var(--rail)}.project-content{min-width:0}.project-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.project-name{margin:0;font-size:14px;font-weight:750}.project-name a{color:var(--ink);text-decoration:none}.project-name a:hover,.project-name a:focus-visible{color:#1769aa;text-decoration:underline;text-underline-offset:2px}.project-link-icon{display:inline-block;margin-left:4px;color:#1769aa;font-size:.85em;line-height:1;vertical-align:baseline}@media(max-width:560px){.project{grid-template-columns:96px minmax(0,1fr);gap:12px}.project-thumbnail{width:96px}}
</style>
</head>
<body><div class="page-tools" role="group" aria-label="Resume actions">
  <button class="tool-button" type="button" onclick="window.print()">Save as PDF</button>
  <details class="share-tool">
    <summary class="tool-button">Share CV</summary>
    <div class="qr-panel">
      <img src="./resume-qr.svg" alt="QR code that opens Antto Väätäinen’s CV">
      <p>Scan to open my CV.</p>
      <a class="qr-download" href="./resume-qr.svg" download="Antto-Vaatainen-CV-QR.svg">Download QR code</a>
    </div>
  </details>
</div>
<!-- Update resume content in resume.json. -->
<div id="resume"></div>
<script>
(async () => {
  const root = document.getElementById('resume');
  try {
    const response = await fetch('./resume.json?v=projects-20261022-v6', { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not load resume.json: ' + response.status);
    const data = await response.json();
  const el = (tag, cls, text) => { const node=document.createElement(tag); if(cls) node.className=cls; if(text!==undefined) node.textContent=text; return node; };
  const main=el('main','main');
  main.append(el('div','eyebrow','Resume'),el('h1','name',data.name),el('p','headline',data.headline),el('p','location',data.location),el('p','intro',data.summary),el('h2','section-title','Experience'));
  data.experience.forEach(job=>{
    const article=el('article','job'),head=el('div','job-head');
    const company=el('div','company',job.company);if(job.url){const link=el('a','company-link');const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('aria-hidden','true');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M14 3h7v7m0-7L10 14');icon.append(path);const box=document.createElementNS('http://www.w3.org/2000/svg','path');box.setAttribute('d','M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6');icon.append(box);link.append(icon);link.href=job.url;link.target='_blank';link.rel='noopener noreferrer';link.title='Opens '+job.company+' website in a new tab';link.setAttribute('aria-label','Visit '+job.company+' website (opens in a new tab)');company.append(link);}head.append(company,el('div','dates',job.dates));
    article.append(head,el('div','role',job.role));
    job.paragraphs.forEach(text=>article.append(el('p','',text)));
    main.append(article);
  });
  if(Array.isArray(data.projects) && data.projects.length){
    const projects=el('section','web-only');
    projects.append(el('h2','section-title','Projects'));
    data.projects.forEach(project=>{
      const article=el('article','project'),head=el('div','project-head');
      if(project.image){
        const imageLink=el('a','project-thumbnail-link');
        if(project.url){imageLink.href=project.url;imageLink.target='_blank';imageLink.rel='noopener noreferrer';imageLink.setAttribute('aria-label','View '+project.name+' product page (opens in a new tab)');}
        const image=el('img','project-thumbnail');image.src=project.image;image.alt=project.name+' game artwork';image.loading='lazy';image.decoding='async';imageLink.append(image);article.append(imageLink);
      }
      const content=el('div','project-content'),name=el('h3','project-name');
      if(project.url){
        const link=el('a','',project.name);link.href=project.url;link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label','View '+project.name+' product page (opens in a new tab)');
        const icon=el('span','project-link-icon','↗');icon.setAttribute('aria-hidden','true');link.append(icon);name.append(link);
      }else name.textContent=project.name;
      head.append(name);
      if(project.dates) head.append(el('div','dates',project.dates));
      content.append(head);
      if(project.description) content.append(el('p','project-description',project.description));
      if(Array.isArray(project.highlights) && project.highlights.length){
        const list=el('ul','project-highlights');
        project.highlights.forEach(item=>list.append(el('li','',item)));
        content.append(list);
      }
      article.append(content);
      projects.append(article);
    });
    main.append(projects);
  }  const rail=el('aside','rail');
  const group=(title,content)=>{const section=el('section');section.append(el('h2','',title),content);rail.append(section);};
  const contact=el('div','contact');contact.append(el('p','',data.location));
  data.contact.forEach(item=>{const p=el('p'),a=el('a','',item.text);a.href=item.href;a.setAttribute('aria-label',item.label+': '+item.text);p.append(a);contact.append(p);});
  group('Contact',contact);
  group('Core Skills',el('p','',data.coreSkills.join(' · ')));
  group('Tools & Technologies',el('p','',data.tools.join(' · ')));
  const page=el('section','resume');page.append(main,rail);root.append(page);
  } catch (error) {
    root.setAttribute('role','alert');
    root.textContent='Unable to load resume.json. Open this page from GitHub Pages or a local web server.';
    console.error(error);
  }
})();
</script>
</body></html>
